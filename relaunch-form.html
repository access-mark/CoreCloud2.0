<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply to Re / Launch – Retrenched Professionals</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f6f8;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #004f91;
      text-align: center;
      margin-bottom: 1rem;
    }
    form {
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 2rem;
      background-color: #0066b2;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      width: 100%;
    }
    button:hover {
      background-color: #004f91;
    }
  </style>
</head>
<body>
  <h1>Apply to Re / Launch (Experienced Track)</h1>
  <form id="relaunchForm">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="Full Name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="Email" required>

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" name="Phone">

    <label for="location">City / Province</label>
    <input type="text" id="location" name="Location">

    <label for="experience">Years of Experience</label>
    <input type="number" id="experience" name="Years of Experience">

    <label for="field">Field / Role / Industry</label>
    <input type="text" id="field" name="Field">

    <label for="linkedin">LinkedIn Profile (optional)</label>
    <input type="url" id="linkedin" name="LinkedIn Profile">

    <label for="availability">Availability</label>
    <select id="availability" name="Availability">
      <option value="Immediate">Immediate</option>
      <option value="1 Month Notice">1 Month Notice</option>
      <option value="Negotiable">Negotiable</option>
    </select>

    <label><input type="checkbox" name="Consent" required> I consent to CoreCloud contacting me regarding opportunities.</label>

    <button type="submit">Submit Application</button>
  </form>

  <script>
    document.getElementById('relaunchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);

      fetch("https://script.google.com/a/macros/corecloudza.com/s/AKfycbyr8DDtL-ehamKEITPeo6zbfcqaUCW_o5yQ6QaVYlwqdkh486-EJ6Vo3I0ZERlbtjU6/exec", {
        method: "POST",
        body: data
      }).then(() => {
        window.location.href = "thank-you.html?type=relaunch";
      }).catch(() => {
        alert("There was a problem submitting your application. Please try again later.");
      });
    });
  </script>
</body>
</html>
