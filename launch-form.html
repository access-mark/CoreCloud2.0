<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply to Re / Launch – Youth Track</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body { font-family:'Segoe UI', Roboto, sans-serif; background:#f4f6f8; padding:2rem; max-width:800px; margin:auto; }
    h1 { color:#004f91; text-align:center; margin-bottom:1rem; }
    form { background:#fff; padding:2rem; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    label { display:block; margin-top:1rem; font-weight:600; }
    input, select, textarea { width:100%; padding:.5rem; margin-top:.3rem; border:1px solid #ccc; border-radius:5px; }
    button { margin-top:2rem; background:#0066b2; color:#fff; padding:.75rem 1.5rem; border:none; border-radius:5px; font-weight:bold; width:100%; cursor:pointer; }
    button:hover { background:#004f91; }
  </style>
</head>
<body>
  <h1>Apply to Re / Launch (Youth Track)</h1>

  <form id="launchForm" action="https://formsubmit.co/mark@corecloudza.com" method="POST" accept-charset="UTF-8">
    <!-- FormSubmit config -->
    <input type="hidden" name="_subject" value="Re/Launch – Youth Track Application">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://www.corecloudza.com/thank-you.html?type=launch">
    <input type="hidden" name="_cc" value="sales@corecloudza.com">
    <!-- Honeypot -->
    <input type="text" name="_honey" style="display:none">

    <label for="name">Full Name</label>
    <input type="text" id="name" name="Full Name" autocomplete="name" required>

    <label for="age">Age</label>
    <input type="number" id="age" name="Age" min="16" max="35" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="Email" autocomplete="email" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="Phone" autocomplete="tel">

    <label for="location">City / Province</label>
    <input type="text" id="location" name="Location" autocomplete="address-level2">

    <label for="education">Education Level</label>
    <select id="education" name="Education" required>
      <option value="" selected disabled>Select your education level</option>
      <option value="Matric">Matric</option>
      <option value="Diploma">Diploma</option>
      <option value="Degree">Degree</option>
      <option value="Other">Other</option>
    </select>

    <label for="interests">Career Interests</label>
    <textarea id="interests" name="Career Interests" rows="3"></textarea>

    <label for="linkedin">LinkedIn Profile (optional)</label>
    <input type="url" id="linkedin" name="LinkedIn Profile" placeholder="https://www.linkedin.com/in/…">

    <label for="consent">
      <input id="consent" type="checkbox" name="Consent" required>
      I consent to CoreCloud contacting me regarding opportunities.
    </label>

    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
