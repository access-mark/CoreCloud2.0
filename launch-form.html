<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply to Re / Launch – Youth Track</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f6f8;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #004f91;
      text-align: center;
      margin-bottom: 1rem;
    }
    form {
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    input[type="file"] {
      padding: 0.4rem;
    }
    button {
      margin-top: 2rem;
      background-color: #0066b2;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      width: 100%;
    }
    button:hover {
      background-color: #004f91;
    }
  </style>
</head>
<body>
  <h1>Apply to Re / Launch (Youth Track)</h1>
  <form id="launchForm" enctype="multipart/form-data">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="Full Name" required>

    <label for="age">Age</label>
    <input type="number" id="age" name="Age" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="Email" required>

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" name="Phone">

    <label for="location">City / Province</label>
    <input type="text" id="location" name="Location">

    <label for="education">Education Level</label>
    <select id="education" name="Education">
      <option value="Matric">Matric</option>
      <option value="Diploma">Diploma</option>
      <option value="Degree">Degree</option>
      <option value="Other">Other</option>
    </select>

    <label for="interests">Career Interests</label>
    <textarea id="interests" name="Career Interests" rows="3"></textarea>

    <label for="linkedin">LinkedIn Profile (optional)</label>
    <input type="url" id="linkedin" name="LinkedIn Profile">

    <label for="cv">Upload Your CV (PDF or Word)</label>
    <input type="file" id="cv" name="CV" accept=".pdf,.doc,.docx" required>

    <label><input type="checkbox" name="Consent" required> I consent to CoreCloud contacting me regarding opportunities.</label>

    <button type="submit">Submit Application</button>
  </form>

  <script>
    document.getElementById('launchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);

      fetch("https://script.google.com/a/macros/corecloudza.com/s/AKfycbwu72Al8RJQ_xUdiKlNnku3H7gc_3nGdC79H3LckpR4V_DrpoORsdnwiwb8B0QlU2rl/exec", {
        method: "POST",
        body: data
      }).then(() => {
        window.location.href = "thank-you.html";
      }).catch(() => {
        alert("There was a problem submitting your application. Please try again later.");
      });
    });
  </script>
</body>
</html>
