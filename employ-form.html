<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner With CoreCloud – Employer Intake</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f6f8;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #004f91;
      text-align: center;
      margin-bottom: 1rem;
    }
    form {
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 2rem;
      background-color: #0066b2;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      width: 100%;
    }
    button:hover {
      background-color: #004f91;
    }
  </style>
</head>
<body>
  <h1>Employer Partnership Intake</h1>
  <form action="mailto:employ@corecloudza.com" method="POST" enctype="text/plain">
    <label for="company">Company Name</label>
    <input type="text" id="company" name="Company Name" required>

    <label for="contact">Contact Person</label>
    <input type="text" id="contact" name="Contact Person" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="Email" required>

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" name="Phone">

    <label for="province">Province / Location</label>
    <input type="text" id="province" name="Province">

    <label for="need">Type of Talent Needed</label>
    <textarea id="need" name="Talent Need" rows="3"></textarea>

    <label for="timeline">Preferred Start Date</label>
    <input type="text" id="timeline" name="Start Date">

    <label for="additional">Additional Notes</label>
    <textarea id="additional" name="Additional Info" rows="3"></textarea>

    <label><input type="checkbox" name="Consent" required> I consent to being contacted by CoreCloud regarding this inquiry.</label>

    <button type="submit">Submit Partnership Inquiry</button>
  </form>
</body>
</html>
