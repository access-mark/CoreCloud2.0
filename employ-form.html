<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner with CoreCloud – Employer Submission</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f6f8;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #004f91;
      text-align: center;
      margin-bottom: 1rem;
    }
    form {
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 2rem;
      background-color: #0066b2;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      width: 100%;
    }
    button:hover {
      background-color: #004f91;
    }
  </style>
</head>
<body>
  <h1>Partner with CoreCloud (Employer Form)</h1>
  <form id="employerForm">
    <label for="company">Company Name</label>
    <input type="text" id="company" name="Company Name" required>

    <label for="contact">Your Name & Surname</label>
    <input type="text" id="contact" name="Contact Person" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="Email" required>

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" name="Phone Number">

    <label for="website">Company Website</label>
    <input type="url" id="website" name="Website">

    <label for="location">Location (City / Province)</label>
    <input type="text" id="location" name="Location">

    <label for="interest">What kind of talent are you looking for?</label>
    <textarea id="interest" name="Talent Needs" rows="4"></textarea>

    <label for="consent">
      <input type="checkbox" name="Consent" required />
      I consent to CoreCloud contacting me about talent solutions.
    </label>

    <button type="submit">Submit Partnership Form</button>
  </form>

  <script>
    document.getElementById('employerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);

      fetch("https://script.google.com/a/macros/corecloudza.com/s/AKfycbwu72Al8RJQ_xUdiKlNnku3H7gc_3nGdC79H3LckpR4V_DrpoORsdnwiwb8B0QlU2rl/exec", {
        method: "POST",
        body: new URLSearchParams(data)
      }).then(() => {
        window.location.href = "thank-you.html";
      }).catch(() => {
        alert("There was a problem submitting your form. Please try again later.");
      });
    });
  </script>
</body>
</html>
