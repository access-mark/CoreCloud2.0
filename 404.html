<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found – CoreCloud</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #333;
    }
    .wrap {
      background: #fff;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 700px;
      width: 100%;
    }
    .wrap img {
      height: 60px;
      margin-bottom: 1rem;
    }
    h1 {
      color: #004f91;
      margin: 0.5rem 0 1rem;
      font-size: 2rem;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      background: #0066b2;
      color: #fff;
      padding: 0.9rem 1.5rem;
      border-radius: 6px;
      font-weight: 700;
      text-decoration: none;
      transition: background .25s ease;
    }
    a.btn:hover {
      background: #004f91;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="assets/images/corecloud-logo.png" alt="CoreCloud Logo" />
    <h1>Oops — Page Not Found</h1>
    <p>The page you’re looking for doesn’t exist or may have moved.<br>
       Let’s get you back on track.</p>
    <a class="btn" href="index.html">Return to Home</a>
  </div>
</body>
</html>
